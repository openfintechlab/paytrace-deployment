name: paytrace

services:
  paytrace-rabbitmq:
    image: dhi.io/rabbitmq:4.2
    hostname: paytrace-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${OFTL_RABITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${OFTL_RABITMQ_PASSWORD_SECRET}
    volumes:
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  paytrace-file-ingest:
    image: openfintechlab/paytrace-file-ingest:latest
    pull_policy: always
    env_file:
      - ../../paytrace-file-ingest-csv/.env
    environment:
      OFTL_FWCSV_ROOTDIR: /app/fwcsv
      OFTL_RABITMQ_HOST: paytrace-rabbitmq
    volumes:
      - ../../fwcsv:/app/fwcsv
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      - paytrace-rabbitmq
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
