name: paytrace

services:
  paytrace-postgres:
    image: dhi.io/postgres:18-alpine3.22-dev
    hostname: paytrace-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${OFTL_POSTGRESDB_USERNAME}
      POSTGRES_PASSWORD: ${OFTL_POSTGRESDB_PASSWORD}
      POSTGRES_DB: ${OFTL_POSTGRESDB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  paytrace-postgres-init:
    image: dhi.io/postgres:18-alpine3.22-dev
    depends_on:
      paytrace-postgres:
        condition: service_healthy
    environment:
      PGHOST: paytrace-postgres
      PGUSER: ${OFTL_POSTGRESDB_USERNAME}
      PGPASSWORD: ${OFTL_POSTGRESDB_PASSWORD}
      PGDATABASE: ${OFTL_POSTGRESDB_NAME}
    volumes:
      - ../sql:/docker-entrypoint-initdb.d:ro
    entrypoint:
      - sh
      - -ec
    command:
      - |
        for sql in /docker-entrypoint-initdb.d/*.sql; do
          [ -e "$$sql" ] || { echo "No SQL files found."; exit 0; }
          echo "Running $$sql"
          psql -v ON_ERROR_STOP=1 -f "$$sql"
        done
    restart: "no"

  paytrace-rabbitmq:
    image: dhi.io/rabbitmq:4.2
    hostname: paytrace-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${OFTL_RABITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${OFTL_RABITMQ_PASSWORD_SECRET}
    volumes:
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  paytrace-file-ingest:
    image: openfintechlab/paytrace-file-ingest:latest
    pull_policy: always
    env_file:
      - ${PAYTRACE_ENV_FILE:?Set PAYTRACE_ENV_FILE before running docker compose}
    environment:
      OFTL_FWCSV_ROOTDIR: /app/fwcsv
      OFTL_RABITMQ_HOST: paytrace-rabbitmq
      OFTL_POSTGRESDB_HOST: paytrace-postgres
      OFTL_POSTGRESDB_SCHEMA: paytrace_ingest
    volumes:
      - ../../fwcsv:/app/fwcsv
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      paytrace-rabbitmq:
        condition: service_started
      paytrace-postgres:
        condition: service_healthy
      paytrace-postgres-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  paytrace-payment-processor:
    image: openfintechlab/paytrace-payment-processor:latest
    pull_policy: always
    env_file:
      - ${PAYTRACE_ENV_FILE:?Set PAYTRACE_ENV_FILE before running docker compose}
    environment:
      OFTL_RABITMQ_HOST: paytrace-rabbitmq
      OFTL_POSTGRESDB_HOST: paytrace-postgres
      OFTL_POSTGRESDB_SCHEMA: paytrace_ingest
      OFTL_HTTPURL_ISO20022ADAP: ${OFTL_HTTPURL_ISO20022ADAP:-http://paytrace-adapter-iso2022:8081/sca/v1/}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      paytrace-rabbitmq:
        condition: service_started
      paytrace-postgres:
        condition: service_healthy
      paytrace-postgres-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
